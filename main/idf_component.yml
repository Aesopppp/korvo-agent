version: "1.0.0"
description: "KorvoAgent - ESP32-S3-Korvo-2 V3.1.2 Smart Voice Assistant"

dependencies:
  # Core ESP-IDF
  idf:
    version: ">=5.4.0"

  # Audio codec abstraction (ES7210 ADC + ES8311 DAC)
  espressif/esp_codec_dev:
    version: ">=1.4.0,<1.5.0"

  # Wake word detection (WakeNet) + AFE VAD pipeline
  # 注意：esp-sr 需要在 menuconfig 中配置模型路径
  #   -> Component config -> ESP Speech Recognition -> Select wake words
  #     常用模型：wn9_hilexin（你好小E）/ wn9_hiesp（你好小智）
  espressif/esp-sr:
    version: "^2.1.3"

  # WebSocket 客户端 (ESP-IDF v5.4 已移出核心，单独拉取)
  # 注意：组件名是 esp_websocket_client（下划线），不是 esp-websocket-client（连字符）
  espressif/esp_websocket_client:
    version: "^1.8.0"
